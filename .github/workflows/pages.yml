name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify generated manager
        run: |
          python3 scripts/build_site.py --check
          python3 scripts/validate_library.py
          python3 -m unittest discover -s test -p 'test_*.py' -v

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/assets _site/04-templates
          cp index.html robots.txt sitemap.xml _site/
          cp assets/app.js assets/favicon.svg assets/styles.css _site/assets/
          cp 04-templates/test-results.csv _site/04-templates/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
